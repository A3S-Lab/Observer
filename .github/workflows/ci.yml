name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Host-buildable parts only: the contracts lib + shared types + parsers. The eBPF crate +
# collector need nightly + bpf-linker (a self-hosted BPF runner) and are not built here.
jobs:
  lib:
    name: lib + parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p a3s-observer -p a3s-observer-common -- -D warnings
      - run: cargo test -p a3s-observer -p a3s-observer-common
      - run: bash scripts/verify-repository-hygiene.sh

  collector:
    name: collector + eBPF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt, clippy
      - name: Install pinned bpf-linker release
        env:
          BPF_LINKER_SHA256: 10f62ba9ab7e544d538370552660efcb4f1a19153d5752bbf0f6b51f3bada450
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/bpf-linker.tar.zst \
            https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst
          echo "${BPF_LINKER_SHA256}  /tmp/bpf-linker.tar.zst" | sha256sum --check
          tar --extract --file /tmp/bpf-linker.tar.zst --directory "${CARGO_HOME}/bin"
          bpf-linker --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p a3s-observer-collector -- -D warnings
      - run: cargo test -p a3s-observer-collector
      - run: cargo build --release -p a3s-observer-collector

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Host-buildable parts only: the contracts lib + shared types + parsers. The eBPF crate +
# collector need nightly + bpf-linker (a self-hosted BPF runner) and are not built here.
jobs:
  lib:
    name: lib + parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p a3s-observer -p a3s-observer-common -- -D warnings
      - run: cargo test -p a3s-observer -p a3s-observer-common
      - run: bash scripts/verify-repository-hygiene.sh

  collector:
    name: collector + eBPF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt, clippy
      - run: cargo install bpf-linker --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p a3s-observer-collector -- -D warnings
      - run: cargo test -p a3s-observer-collector
      - run: cargo build --release -p a3s-observer-collector

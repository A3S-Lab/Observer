[package]
name = "a3s-observer-collector"
version = "0.11.0"
edition = "2021"
license = "MIT"
description = "a3s-observer collector: loads the eBPF probes and exports enriched events."

[features]
default = []
legacy-kernel-4-19 = ["aya/async_tokio", "dep:bytes"]

[dependencies]
a3s-observer = { path = ".." }
a3s-observer-common = { path = "../a3s-observer-common" }
aya = "0.13"
anyhow = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
libc = "0.2"
bytes = { version = "1", optional = true }
serde_json = "1"
sha2 = "0.10"
httparse = "1.10"
flate2 = "1"
base64 = "0.22"
# SIMD substring search for the SSE delimiter/terminal scanning hot path. The previous naive
# sliding-window scan measurably pinned a collector core at 100% on long streaming responses.
memchr = "2"

[build-dependencies]
aya-build = "0.1"
anyhow = "1"

[[bin]]
name = "a3s-observer-collector"
path = "src/main.rs"

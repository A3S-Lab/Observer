[package]
name = "a3s-observer-collector"
version = "0.11.0"
edition = "2021"
license = "MIT"
description = "a3s-observer collector: loads the eBPF probes and exports enriched events."

[dependencies]
a3s-observer = { path = ".." }
a3s-observer-common = { path = "../a3s-observer-common" }
aya = "0.13"
anyhow = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
httparse = "1.10"
flate2 = "1"
base64 = "0.22"

[build-dependencies]
aya-build = "0.1"
anyhow = "1"

[[bin]]
name = "a3s-observer-collector"
path = "src/main.rs"
